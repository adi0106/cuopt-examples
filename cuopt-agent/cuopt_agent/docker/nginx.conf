# Routes POST /generate to NAT's streaming vs non-streaming endpoint.
# The request-body `stream` flag is authoritative: an explicit
# `"stream": true|false` selects /generate/stream (SSE) or /generate (JSON).
# Only when the body omits `stream` does the `Accept: text/event-stream` header
# act as a fallback. The body wins because NVCF STREAMING-type functions send
# `Accept: text/event-stream` to the container on every invocation (so
# Accept-based routing would stream unconditionally), while the body is
# forwarded verbatim and reflects the caller's intent. Selection logic lives in
# sse.route (njs). Any other path is proxied through unchanged.
#
# For the streaming path, an njs body filter reshapes NAT's `intermediate_data:`
# events into chat-completion-shaped `data:` chunks so UIs that only understand
# `data:` can still display reasoning, planning, and tool execution.

js_import sse from /etc/nginx/njs/sse_transform.js;
js_var $sse_buf "";
js_var $generate_uri "/generate";

upstream cuopt_agent {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 8000;
    server_name _;

    # Long-running agent runs: don't cut SSE streams or slow JSON responses.
    proxy_read_timeout 30m;
    proxy_send_timeout 30m;

    # Header/body-routed entrypoint. js_content reads the request (Accept header
    # plus the body `stream` flag) and internally redirects to the proxy
    # location below. The body must be buffered in memory for the flag check;
    # requests larger than client_body_buffer_size spill to a temp file and fall
    # back to Accept-only routing (raise the buffer if very large streaming
    # requests need body-based detection).
    location = /generate {
        client_body_in_single_buffer on;
        client_body_buffer_size 1m;
        js_content sse.route;
    }

    # Internal proxy target. $generate_uri is set by sse.route. proxy_pass with
    # a $var URI bypasses location rewriting, so the upstream sees exactly
    # $generate_uri.
    location = /__generate_proxy {
        internal;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Block upstream compression so the njs body filter sees plain text.
        proxy_set_header Accept-Encoding "";

        # SSE needs unbuffered streaming; harmless for JSON responses.
        proxy_buffering off;
        proxy_cache off;

        # Reshape `intermediate_data:` SSE lines into chat-completion `data:`
        # chunks. No-op for non-SSE responses (no matching prefixes to rewrite).
        js_body_filter sse.transform;

        proxy_pass http://cuopt_agent$generate_uri$is_args$args;
    }

    # Everything else (incl. /generate/stream, /generate/full, /health,
    # /websocket, /chat, /v1/chat/completions) passes straight through.
    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;

        proxy_pass http://cuopt_agent;
    }
}
